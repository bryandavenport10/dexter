[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-core"
version = "0.1.0"
description = "Governed entity contracts and validation primitives for Dexter AI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dexter AI Contributors" }]
keywords = ["governance", "provenance", "entities", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1"]

[project.urls]
Repository = "https://github.com/dexter-ai/dexter-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dexter_core = ["py.typed"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
