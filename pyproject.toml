[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-core"
version = "0.1.0"
description = "Governed entity contracts and validation primitives for Dexter AI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dexter AI Contributors" }]
keywords = ["governance", "provenance", "entities", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["fastapi>=0.116,<1", "typer>=0.16,<1"]

[project.scripts]
dexter = "dexter_core.cli:app"

[project.optional-dependencies]
dev = ["build>=1"]

[project.urls]
Repository = "https://github.com/bryandavenport10/dexter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dexter_core = ["py.typed"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]
